## 记录规则

1. 使用某参考项目前，先在条目中固定 commit 与 retrieved_at（工程可复现性）。
2. **禁止复制**任何参考项目的代码片段、代码文件、二进制或数据文件进入组件；
   允许的仅限：阅读、运行对照（oracle）、逆向分析、自行编写实现。
3. 仓库状态变化后重新核验并更新条目，不追溯改写旧记录。
