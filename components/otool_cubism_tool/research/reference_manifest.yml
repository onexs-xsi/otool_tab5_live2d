## 记录规则

1. 任何条目在 `allowed_use` 非空且 `approval_ticket` 为空时，**不得**用于实现。
2. 用途变化（如 oracle → code-reference）必须重新审批并追加记录，不改写历史。
3. 官方 Core 只有在书面确认允许"差分 oracle"用途后才能进入 oracle_runner。
4. 严格 clean-room 场景下，实现团队不得接触本清单中标注 code-reference 的材料。
