# otool_cubism_tool — 研究来源清单（reference manifest）

> 治理要求见可行性报告 §3.4 / §6.4。本文件记录每个研究来源的用途、许可证、
> 固定 commit 与审批状态；**仓库更新不会自动改变已批准用途**。
> 所有条目在首次用于研究前必须完成审批（approval_ticket 非空）。

## 条目模板

```yaml
- name: <项目名>
  url: <仓库 URL>
  commit: <固定 commit SHA，禁止跟 master>
  retrieved_at: <YYYY-MM-DD>
  license_spdx: <SPDX 标识或 "none">
  license_file_hash: <SHA-256，若本地有许可文本>
  source_tarball_hash: <SHA-256，若已下载源码包>
  provenance: <来源说明：作者/组织、已知历史、有无反编译链路等>
  allowed_use:
    - <code-reference | oracle | test-only | excluded>
  approval_ticket: <审批编号；空 = 未审批，禁止用于实现>
  local_patches: <本地补丁说明，无则 "-">
```

