# otool_cubism_tool — 研究来源索引（reference manifest）

> 工程用途：固定各参考项目的 URL / commit / hash，保证研究可复现。
>
> **自研代码铁律（2026-08-21）**：构成组件的所有代码必须自研。
> 第三方项目与 SDK **只允许研究参考**（阅读、逆向、运行对照、理解行为），
> **禁止**复制其代码片段、代码文件、二进制文件或数据文件进入本组件。
> 任何进入组件的实现都必须基于自身研究重新编写。
>
> 项目定位：私有个人项目，不开源、不上市、不发布；允许逆向分析等研究方式；
> 本清单是**工程记录 + 来源用途声明**，不是合规门禁。

## 条目模板

```yaml
- name: <项目名>
  url: <仓库 URL>
  commit: <固定 commit SHA，便于复现>
  retrieved_at: <YYYY-MM-DD>
  license: <许可证说明，仅作信息记录>
  allowed_use: reference-only   # 仅研究参考；禁止复制代码/二进制/数据
  notes: <来源说明与已知限制>
```

