## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  ## 固定为 v6.1-beta1（组件管理器将其规范化为 6.1.0-beta1，
  ## dependencies.lock 中显示为 6.1.0 属正常规范化行为）
  idf:
    version: '>=6.1.0-beta1,<6.2.0'
  ## ESP-Hosted: P4 主控通过 SDIO 连接 C6 从机作为 Wi-Fi/蓝牙协处理器
  espressif/esp_hosted:
    version: '^2.12.3'
  espressif/esp_wifi_remote:
    version: '^1.5.1'
